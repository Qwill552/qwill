<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#eef1f6" />
    <title>Qwill</title>
    <!-- Кириллические подмножества: без них первый кадр интерфейса рисуется системным шрифтом
         и вся вёрстка на нём дёргается при подмене. Латиница догрузится обычным порядком. -->
    <link rel="preload" href="/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Тема применяется до первого кадра, иначе моргнёт чужая (UI-1).
      // Значения должны совпадать с --bg из tokens.css.
      (function () {
        var BG = { light: '#eef1f6', dark: '#0a0c12' };
        var root = document.documentElement;
        var theme = 'light';
        try {
          var storedTheme = localStorage.getItem('messenger.theme');
          theme =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
        } catch (e) {
          /* приватный режим без localStorage — остаются значения по умолчанию */
        }
        root.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', BG[theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
