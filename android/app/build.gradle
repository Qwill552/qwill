plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def versionProperties = new Properties()
versionProperties.load(new FileInputStream(rootProject.file('../client/android/version.properties')))

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'com.qwill.app'
    compileSdk = 36

    defaultConfig {
        applicationId 'com.qwill.app'
        minSdk 21
        targetSdk 36
        versionCode versionProperties.getProperty('versionCode').toInteger()
        versionName versionProperties.getProperty('versionName')

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
    }

    ndkVersion = '28.2.13676358'

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions = ['channel']
    productFlavors {
        prod {
            dimension 'channel'
            buildConfigField 'String', 'API_ORIGIN', '"https://qwill.mooo.com"'
        }
        nat {
            dimension 'channel'
            applicationIdSuffix '.nat'
            versionNameSuffix '-nat'
            buildConfigField 'String', 'API_ORIGIN', '"https://dev.qwill.mooo.com"'
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

abstract class EmojiAssetsTask extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getSources()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copyAll() {
        def target = new File(outputDir.get().asFile, 'emoji')
        target.mkdirs()
        sources.files.each { file ->
            java.nio.file.Files.copy(file.toPath(), new File(target, file.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

def emojiAssets = tasks.register('emojiAssets', EmojiAssetsTask) {
    sources.from(rootProject.file('../client/public/emoji/sheet.webp'), rootProject.file('../client/public/emoji/index.json'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(emojiAssets, EmojiAssetsTask::getOutputDir)
    }
}

dependencies {
    implementation project(':recyclerview')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.xerial:sqlite-jdbc:3.53.4.0'
}
