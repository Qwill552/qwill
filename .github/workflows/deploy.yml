name: Deploy

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      ref:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Два одновременных деплоя, применяющих миграции, — надёжный способ испортить базу.
    # Группа своя на контур: базы разные, блокировать друг друга им незачем.
    concurrency:
      group: deploy-${{ inputs.channel }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @messenger/shared

      - name: Build server
        run: npm run build -w @messenger/server

      # VITE_API_URL обязателен: фолбэк в client/src/api/client.ts хардкодит порт 3000,
      # который наружу не смотрит. Он же разводит контуры: один dist не может обслуживать
      # оба домена. VITE_VAPID_PUBLIC_KEY обязан совпадать с серверным, иначе пуши
      # перестают работать молча — пара общая для обоих контуров.
      - name: Build client
        run: npm run build -w @messenger/client
        env:
          VITE_API_URL: ${{ inputs.channel == 'prod' && 'https://qwill.mooo.com' || 'https://dev.qwill.mooo.com' }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # server/prisma.config.ts лежит рядом с каталогом prisma/, под шаблон server/prisma
      # не попадает, а без него Prisma 7 не знает строку подключения.
      # server/assets — шрифты визитки: tsc их не компилирует, а сервер читает из этой папки.
      - name: Pack release
        run: |
          tar czf release.tar.gz \
            package.json package-lock.json \
            shared/package.json shared/dist \
            server/package.json server/prisma.config.ts server/dist server/prisma server/assets \
            client/package.json client/dist \
            scripts/announce.mjs \
            deploy

      - name: Upload and activate
        env:
          RELEASE: ${{ inputs.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/release-$RELEASE.tar.gz"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/bin/qwill-release $RELEASE $CHANNEL"

      - name: Проверить контур снаружи
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = "prod" ]; then HOST=qwill.mooo.com; else HOST=dev.qwill.mooo.com; fi
          for _ in $(seq 1 10); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://$HOST/api/health" || true)
            if [ "$CODE" = "200" ]; then
              echo "https://$HOST/api/health -> 200"
              exit 0
            fi
            sleep 5
          done
          echo "https://$HOST/api/health не ответил 200 после деплоя"
          exit 1
