name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Только Postgres из сервис-контейнера — E2E (Playwright) сюда намеренно не входят,
    # запускаются по требованию (секция 9 project-design.md).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger
          POSTGRES_DB: messenger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://messenger:messenger@localhost:5432/messenger_test?schema=public
      # Только для CI — не используется нигде за пределами этого job'а.
      JWT_SECRET: ci-secret-not-used-anywhere-else-please-do-not-reuse-it
      CLIENT_ORIGIN: http://localhost:5173
      # AccessToken подписывается локально (server/src/services/call.ts), сетевых вызовов
      # к LiveKit в тестах нет — реальные значения не нужны.
      LIVEKIT_URL: wss://ci-not-used-anywhere-else.invalid
      LIVEKIT_API_KEY: ci-livekit-key-not-used-anywhere-else
      LIVEKIT_API_SECRET: ci-livekit-secret-not-used-anywhere-else

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Без ключей push.ts отключает уведомления и тесты пушей падают. Произвольную строку
      # подставить нельзя: тесты без мока web-push поднимают настоящий setVapidDetails,
      # который отвергнет ключ неправильной длины и уронит весь прогон.
      - name: Generate throwaway VAPID keys
        run: |
          node -e "const k=require('web-push').generateVAPIDKeys();console.log('VAPID_PUBLIC_KEY='+k.publicKey);console.log('VAPID_PRIVATE_KEY='+k.privateKey)" >> "$GITHUB_ENV"

      # server и client резолвят @messenger/shared через dist/ (package.json "main"/"exports") —
      # без сборки типы и рантайм-импорты не находятся (секция 1 project-design.md).
      - name: Build shared package
        run: npm run build -w @messenger/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply database migrations
        run: npm run db:deploy -w @messenger/server

      - name: Unit + integration tests
        run: npm test

  deploy-dev:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    with:
      channel: dev
      ref: ${{ github.sha }}
    secrets: inherit
