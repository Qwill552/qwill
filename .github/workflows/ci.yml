name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Пуш в main не отменяем: у деплоя дальше по цепочке миграции, а прерванная миграция —
# это испорченная база. PR-прогоны перебивать друг другом можно и нужно.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  tests-server:
    runs-on: ubuntu-latest

    # E2E (Playwright) сюда намеренно не входят, запускаются по требованию
    # (секция 9 project-design.md).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # У каждого шарда свой контейнер Postgres в своей виртуалке, поэтому
    # fileParallelism: false внутри шарда шардам друг друга не мешает.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger
          POSTGRES_DB: messenger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://messenger:messenger@localhost:5432/messenger_test?schema=public
      # Только для CI — не используется нигде за пределами этого job'а.
      JWT_SECRET: ci-secret-not-used-anywhere-else-please-do-not-reuse-it
      CLIENT_ORIGIN: http://localhost:5173
      # AccessToken подписывается локально (server/src/services/call.ts), сетевых вызовов
      # к LiveKit в тестах нет — реальные значения не нужны.
      LIVEKIT_URL: wss://ci-not-used-anywhere-else.invalid
      LIVEKIT_API_KEY: ci-livekit-key-not-used-anywhere-else
      LIVEKIT_API_SECRET: ci-livekit-secret-not-used-anywhere-else

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      # Без ключей push.ts отключает уведомления и тесты пушей падают. Произвольную строку
      # подставить нельзя: тесты без мока web-push поднимают настоящий setVapidDetails,
      # который отвергнет ключ неправильной длины и уронит весь прогон.
      - name: Generate throwaway VAPID keys
        run: |
          node -e "const k=require('web-push').generateVAPIDKeys();console.log('VAPID_PUBLIC_KEY='+k.publicKey);console.log('VAPID_PRIVATE_KEY='+k.privateKey)" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: npm run db:deploy -w @messenger/server

      - name: Server tests (шард ${{ matrix.shard }}/3)
        run: npm run test -w @messenger/server -- --shard=${{ matrix.shard }}/3

  tests-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Shared tests
        run: npm run test -w @messenger/shared

      - name: Client tests
        run: npm run test -w @messenger/client

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build server
        run: npm run build -w @messenger/server

      # VITE_API_URL обязателен: фолбэк в client/src/api/client.ts хардкодит порт 3000,
      # который наружу не смотрит. Он же разводит контуры — поэтому здесь собирается
      # только dev; прод собирается в deploy.yml, куда приходит произвольный ref.
      - name: Build client
        run: npm run build -w @messenger/client
        env:
          VITE_API_URL: https://dev.qwill.mooo.com
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # server/prisma.config.ts лежит рядом с каталогом prisma/, под шаблон server/prisma
      # не попадает, а без него Prisma 7 не знает строку подключения.
      # server/assets — шрифты визитки: tsc их не компилирует, а сервер читает из этой папки.
      - name: Pack release
        run: |
          tar czf release.tar.gz \
            package.json package-lock.json \
            shared/package.json shared/dist \
            server/package.json server/prisma.config.ts server/dist server/prisma server/assets \
            client/package.json client/dist \
            scripts/announce.mjs \
            deploy \
            legal

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: release-dev
          path: release.tar.gz
          retention-days: 1
          compression-level: 0

  # Один check-run с именем "ci" на всю сборку: на него смотрит promote.yml
  # и защита ветки, чтобы им не приходилось знать про состав job'ов.
  ci:
    needs: [checks, tests-server, tests-client, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Свести результаты
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  deploy-dev:
    needs: [checks, tests-server, tests-client, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    with:
      channel: dev
      ref: ${{ github.sha }}
      artifact: release-dev
    secrets: inherit
