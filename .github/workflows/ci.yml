name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Только Postgres из сервис-контейнера — E2E (Playwright) сюда намеренно не входят,
    # запускаются по требованию (секция 9 project-design.md).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger
          POSTGRES_DB: messenger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://messenger:messenger@localhost:5432/messenger_test?schema=public
      # Только для CI — не используется нигде за пределами этого job'а.
      JWT_SECRET: ci-secret-not-used-anywhere-else-please-do-not-reuse-it
      CLIENT_ORIGIN: http://localhost:5173
      # AccessToken подписывается локально (server/src/services/call.ts), сетевых вызовов
      # к LiveKit в тестах нет — реальные значения не нужны.
      LIVEKIT_URL: wss://ci-not-used-anywhere-else.invalid
      LIVEKIT_API_KEY: ci-livekit-key-not-used-anywhere-else
      LIVEKIT_API_SECRET: ci-livekit-secret-not-used-anywhere-else

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Без ключей push.ts отключает уведомления и тесты пушей падают. Произвольную строку
      # подставить нельзя: тесты без мока web-push поднимают настоящий setVapidDetails,
      # который отвергнет ключ неправильной длины и уронит весь прогон.
      - name: Generate throwaway VAPID keys
        run: |
          node -e "const k=require('web-push').generateVAPIDKeys();console.log('VAPID_PUBLIC_KEY='+k.publicKey);console.log('VAPID_PRIVATE_KEY='+k.privateKey)" >> "$GITHUB_ENV"

      # server и client резолвят @messenger/shared через dist/ (package.json "main"/"exports") —
      # без сборки типы и рантайм-импорты не находятся (секция 1 project-design.md).
      - name: Build shared package
        run: npm run build -w @messenger/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply database migrations
        run: npm run db:deploy -w @messenger/server

      - name: Unit + integration tests
        run: npm test

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    # Два одновременных деплоя, применяющих миграции, — надёжный способ испортить базу.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @messenger/shared

      - name: Build server
        run: npm run build -w @messenger/server

      # VITE_API_URL обязателен: фолбэк в client/src/api/client.ts хардкодит порт 3000,
      # который наружу не смотрит. VITE_VAPID_PUBLIC_KEY обязан совпадать с серверным,
      # иначе пуши перестают работать молча.
      - name: Build client
        run: npm run build -w @messenger/client
        env:
          VITE_API_URL: https://qwill.mooo.com
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # server/prisma.config.ts лежит рядом с каталогом prisma/, под шаблон server/prisma
      # не попадает, а без него Prisma 7 не знает строку подключения.
      - name: Pack release
        run: |
          tar czf release.tar.gz \
            package.json package-lock.json \
            shared/package.json shared/dist \
            server/package.json server/prisma.config.ts server/dist server/prisma \
            client/package.json client/dist \
            deploy

      - name: Upload and activate
        env:
          RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/release-$RELEASE.tar.gz"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/bin/qwill-release $RELEASE"
