name: Выпустить в прод

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Что выпускаем: ветка или коммит. По умолчанию main"
        required: false
        default: main

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Определить коммит
        id: resolve
        env:
          REF: ${{ inputs.ref }}
        run: |
          SHA=$(git rev-parse "origin/$REF" 2>/dev/null || git rev-parse "$REF")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Выпускается $SHA"

      # CI пропускает пуши, где изменилась только документация, поэтому у верхнего коммита
      # прогона может не быть вовсе. Тогда берётся ближайший предок с прогоном — и отдельно
      # проверяется, что выше него правда нет ничего, кроме документации.
      - name: Проверить, что CI зелёный
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          DOC_ONLY='^.*\.md$'
          CANDIDATE="$SHA"
          CONCLUSION=""
          for _ in $(seq 1 30); do
            CONCLUSION=$(gh api "repos/$REPO/commits/$CANDIDATE/check-runs" --jq '[.check_runs[] | select(.name == "ci")][0].conclusion // ""')
            if [ -n "$CONCLUSION" ]; then break; fi
            PARENT=$(git rev-parse --quiet --verify "$CANDIDATE^" || true)
            if [ -z "$PARENT" ]; then break; fi
            CANDIDATE="$PARENT"
          done

          if [ -z "$CONCLUSION" ]; then
            echo "Ни для $SHA, ни для его предков CI не запускался — выпуск остановлен"
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "CI для $CANDIDATE не зелёный (conclusion: $CONCLUSION) — выпуск остановлен"
            exit 1
          fi

          if [ "$CANDIDATE" = "$SHA" ]; then
            echo "CI зелёный ($SHA), продолжаем"
            exit 0
          fi

          UNEXPECTED=$(git diff --name-only "$CANDIDATE" "$SHA" | grep -Ev "$DOC_ONLY" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "У $SHA нет прогона CI, а над зелёным $CANDIDATE изменена не только документация:"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "CI зелёный на $CANDIDATE, выше него только документация — продолжаем"

      - name: Что уедет людям
        run: git log --oneline "origin/prod..$SHA" || echo "ветки prod ещё нет"
        env:
          SHA: ${{ steps.resolve.outputs.sha }}

      # force, а не fast-forward: та же кнопка с прошлым sha — это откат.
      - name: Перевести ветку prod
        run: git push --force origin "${{ steps.resolve.outputs.sha }}:refs/heads/prod"

  deploy:
    needs: promote
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      channel: prod
      ref: ${{ needs.promote.outputs.sha }}
    secrets: inherit
