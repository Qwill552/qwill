name: Выпустить в прод

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Что выпускаем: ветка или коммит. По умолчанию main"
        required: false
        default: main

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Определить коммит
        id: resolve
        env:
          REF: ${{ inputs.ref }}
        run: |
          SHA=$(git rev-parse "origin/$REF" 2>/dev/null || git rev-parse "$REF")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Выпускается $SHA"

      - name: Проверить, что CI зелёный
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          CONCLUSION=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name == "ci")][0].conclusion // "нет прогона"')
          if [ "$CONCLUSION" != "success" ]; then
            echo "CI для $SHA не зелёный (conclusion: $CONCLUSION) — выпуск остановлен"
            exit 1
          fi
          echo "CI зелёный ($SHA), продолжаем"

      - name: Что уедет людям
        run: git log --oneline "origin/prod..$SHA" || echo "ветки prod ещё нет"
        env:
          SHA: ${{ steps.resolve.outputs.sha }}

      # force, а не fast-forward: та же кнопка с прошлым sha — это откат.
      - name: Перевести ветку prod
        run: git push --force origin "${{ steps.resolve.outputs.sha }}:refs/heads/prod"

  deploy:
    needs: promote
    uses: ./.github/workflows/deploy.yml
    with:
      channel: prod
      ref: ${{ needs.promote.outputs.sha }}
    secrets: inherit
